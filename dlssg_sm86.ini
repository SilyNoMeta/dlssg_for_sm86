; DLSSG 310.9.1-11: DLL engine and optional ReShade controls.
; Keep this filename: dlssg_sm86.ini, beside our DLL/ASI.
; Startup settings and bindings are read once: restart after editing.
; Docs: docs/live-controls.en.md (also French and Simplified Chinese).
; Kernel options: README.en.md and docs/research.en.md.
[FrameGeneration]
; Generated frames per rendered frame, within the loaded plugin's support.
; 1=X2, 2=X3, 3=X4, 4=X5, 5=X6. Missing/invalid values default to 5.
; A ceiling of 1 keeps X2 and its required compatibility patches enabled.
MaxInterpolatedFrames=5
; ForceMultiplier uses the displayed X factor: 0 follows the game, 2..6 forces X2..X6.
ForceMultiplier=0
DynamicMFG=0
DynamicTargetFPS=0

[SuperResolution]
; Linear DLSS render percentage: 0 follows the game (default).
; 100=DLAA scale, 66.667=Quality, 58.824=Balanced, 50=Performance, 33.333=Ultra Performance.
; Custom values: 50..100; 33.333 is the separate Ultra Performance preset.
; Values from 33.334 to 49.999 are unsupported and fall back to game control.
; Experimental: mainly useful for injected DLSS without in-game quality controls.
; If the game offers DLSS quality/render scale, use its menus and leave this at 0.
; Available for all games, but injection alone does not guarantee compatibility.
; May be ignored or cached; saving/restarting does not guarantee application.
; If an override prevents startup, reset this to 0. DLSS must already be active.
; Panel saves require applying first and observing 8 matching DLSS frames.
; Manual INI edits bypass that check; prefer the panel. Saving 0 is always allowed.
RenderScale=0

[Optimizations]
; Experimental performance options: 1=on, 0=reference kernel. Restart required.
; Missing keys default to 1. No guaranteed game FPS gain; no INT8/FP8 enabled.
; Experimental: hardware bilinear sampling in final reconstruction (k60).
; Can change pixels slightly compared with manual interpolation. Default: 1.
HardwareBilinear=1
; Experimental: reuse FP16 inputs in shared memory in convolution k13.
; Preserves arithmetic in tested cases; extra shared memory/barrier. Default: 1.
Conv13SharedInput=1
; Experimental: reuse the input tile/halo in reconstruction convolution k0.
; Preserves Tensor Core operation order; benefit depends on workload. Default: 1.
Conv0SharedInput=1
; Experimental: grouped 128-bit input reads in residual convolutions k5/k11.
; Preserves arithmetic; not weight quantization or reduced precision. Default: 1.
ResidualVectorLoads=1

[Quality]
; Experimental: give accepted motion-warped colors full weight in blend k39.
; Aims to preserve thin details; can amplify wrong motion, ghosting or HUD artifacts.
; Fixed RGB thresholds are not HDR-calibrated. No established FPS gain.
; 0=existing blend (default), 1=experiment; supports both blend algorithms.
; Ada/Blackwell name the kernel origin, not the required GPU: SM75/86/89 ports.
; Requires a quality-enabled engine and a full game restart.
QualityValidWarp=0

[Experimental]
; Experimental: use Blackwell-derived intermediate motion scatter (k46).
; Changes motion candidate processing, not presentation timing or Reflex.
; May alter occlusions/motion errors. 0=Ada (default), 1=Blackwell port.
; Two Wukong GPU hangs in two trials: keep OFF outside diagnostic reproduction.
; Requires the private experiment engine and a full game restart.
BlackwellScatter=0
; Experimental: use Blackwell-derived candidate blend (k39), independently of scatter.
; QualityValidWarp applies to this blend when both are 1. No general benefit proven.
; Wukong GPU hangs reproduced with Blend alone too: keep OFF outside diagnostics.
; 0=Ada (default), 1=Blackwell port. Requires experiment engine and full restart.
BlackwellBlend=0

[Logging]
; 0 disables this bridge's log only. Existing logs are preserved.
Enabled=1

[Telemetry]
; Optional CPU source-frame cadence. Requires a compatible overlay consumer.
; Official unmodified OptiScaler does not read this interface yet.
; 0 disables collection; 1 enables it. Restart after editing.
Enabled=0

[Hotkeys]
; Default shortcuts. Change a binding or leave it empty to disable that action.
ForceX2=Ctrl+F2
ForceX3=Ctrl+F3
ForceX4=Ctrl+F4
ForceX5=Ctrl+F5
ForceX6=Ctrl+F6
; Return to the settings read from this INI at launch.
RestoreINI=Ctrl+F12
; Follow the game's own fixed/dynamic choice, ignoring our INI force/dynamic.
FollowGame=Ctrl+F11
; Request native dynamic with DynamicTargetFPS above (compatible DX12 only).
ActivateDynamicMFG=Ctrl+F10
