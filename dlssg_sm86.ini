; DLSSG 310.9.1-9. Edit this file to choose your own settings.
; Keep the name dlssg_sm86.ini beside our DLL/ASI, even when renaming the DLL.
; Restart the game after editing. Enable DLSS Frame Generation in the game.
; Fixed overrides require recognized Streamline; native dynamic requires DX12.
; Target 0 uses display refresh. VSync can take precedence over a custom target.

[FrameGeneration]
; Allow up to X6 where the plugin supports it. Missing key defaults to X4.
MaxMultiplier=6
; 0 follows the game; 2..MaxMultiplier requests that fixed multiplier.
; With dynamic requested, a supported nonzero fixed value becomes the fallback.
ForceMultiplier=0
; 1 requests native dynamic support; 0 leaves the game's mode selection intact.
DynamicMFG=0
; Choose your own target: 0 = display refresh, 1..1000 = requested FPS.
; Used with DynamicMFG=1. A target is not a promise of constant FPS.
DynamicTargetFPS=0

[Optimizations]
; 1 = on, 0 = off. Missing optimization keys default to 1.
; Temporal correction stays active even with all four options off.
; Hardware filtering during final reconstruction; small pixel changes possible.
HardwareBilinear=1
; Reuse convolution inputs in fast shared GPU memory.
Conv13SharedInput=1
Conv0SharedInput=1
; Group input reads in two residual convolutions.
ResidualVectorLoads=1
